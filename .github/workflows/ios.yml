
name: HAMA CODEX iOS Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate --spec project.yml

      - name: Verify Project
        run: ls -la HamaCodex.xcodeproj

      - name: Build HAMA CODEX
        run: |
          xcodebuild \
            -project HamaCodex.xcodeproj \
            -scheme HAMA-CODEX \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Upload Build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HAMA-CODEX-Build
          path: build/
